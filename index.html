<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciamento de Campeonatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#164734;--g2:#30634B;--g3:#2ECD71;--bg:#F3F5F4;--w:#FFFFFF;--t1:#25332B;--t2:#66756B;--err:#FF3B30;--sel:#E8F2EC;--line:#DDE4DF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,Roboto,system-ui,Arial,sans-serif;background:var(--bg);color:var(--t1);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid #2ECD71aa;outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.top{height:56px;background:var(--g1);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;font-weight:600}
.top .burger{display:none;color:#fff;padding:6px}
.wrap{padding:0;display:flex;justify-content:center}
.panel{width:100%;height:calc(100vh - 56px);min-height:480px;background:var(--w);display:flex;overflow:hidden}
.side{width:288px;flex:none;background:var(--g1);color:#E6EFEA;padding:24px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side h4{margin:14px 12px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#A9C4B6;font-weight:600}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#E6EFEA;text-decoration:none}
.side a:hover{background:#ffffff14}
.side a.on{background:var(--g2);color:#fff;font-weight:700}
.side .ctitle{display:flex;gap:10px;align-items:center;font-weight:700;color:#fff;font-size:17px;padding:4px 12px 14px;word-break:break-word}
.side .foot{margin-top:auto;border-top:1px solid #ffffff22;padding-top:12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.side .foot span{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot button{color:#fff;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:10px}
.side .foot button:hover{background:#ffffff14}
.main{flex:1;min-width:0;overflow:auto;padding:16px 20px;position:relative;display:flex;flex-direction:column}
.main>*{flex-shrink:0}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--t2)}
.tools{display:flex;justify-content:flex-end;gap:14px;margin-bottom:10px;color:var(--g1)}
.ibtn{display:inline-flex;align-items:center;gap:4px;color:var(--g1);padding:6px;border-radius:8px;font-weight:600;font-size:13px}
.ibtn:hover{background:var(--sel)}
.ibtn .ic{width:18px;height:18px}
.addrow{display:flex;gap:14px;align-items:center}
.addrow input{flex:1;min-width:0;height:44px;border:2px solid var(--g1);border-radius:6px;padding:0 12px;font-size:16px;background:#fff}
.pill{background:var(--g3);color:var(--g1);border-radius:999px;height:34px;padding:0 20px;font-size:14px;font-weight:600;white-space:nowrap}
.pill:hover{filter:brightness(.95)}
.pill.dark{background:var(--g1);color:#fff}
.pill.red{background:var(--err);color:#fff}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--t1)}
.pill.big{height:42px;padding:0 24px;letter-spacing:.03em}
.total{font-size:14px;margin:8px 0 10px}
.err{color:var(--err);font-size:13px;margin:6px 0 0;min-height:0}
.warn{color:var(--err);font-size:12px;margin:auto 0 0;padding-top:16px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:8px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows li.sel{background:var(--sel)}
.rows input[type=checkbox],.chk input{width:18px;height:18px;accent-color:var(--g1);flex:none}
.name{font-weight:500;text-align:left;padding:4px 6px;border-radius:6px}
.name:hover{background:var(--sel);text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sel);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{display:flex;color:var(--t2);border-radius:50%}
.chip .ic{width:14px;height:14px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--t2);white-space:nowrap}
.tag.ok,.tag.done{background:#DDF7E8;color:#12683A}
.tag.live,.tag.pend{background:#FFF1D6;color:#8A5A00}
.tag.off{background:#EEE;color:#666}
select,.inp{height:40px;border:1px solid #C9D3CD;border-radius:10px;padding:0 10px;background:#fff;max-width:100%}
.inp{width:100%;height:46px;font-size:16px}
.sm{height:32px;font-size:13px}
.empty{color:var(--t2);padding:28px 0;text-align:center}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.card .go{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left}
.card .go b{display:block;font-size:16px;word-break:break-word}
.card .go small{color:var(--t2)}
.card:hover{border-color:var(--g2)}
.trophy{width:40px;height:40px;border-radius:12px;background:var(--sel);color:var(--g1);display:grid;place-items:center;flex:none}
.fab{position:sticky;bottom:0;align-self:flex-end;margin-top:auto;width:52px;height:52px;border-radius:14px;background:var(--g1);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px #16473455;flex:none}
.fab .ic{width:26px;height:26px}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;color:var(--t2);font-size:14px}
.crumb a{color:var(--g1);font-weight:600;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb .sp{flex:1}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 24px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:180px;background:#fff}
.kpi small{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.08em;color:var(--t2);font-weight:600}
.kpi small .ic{width:14px;height:14px;color:var(--g1)}
.kpi b{font-size:16px}
.kpi .status-line{display:flex;align-items:center;gap:8px}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.status-dot.prep{background:#3B82F6}.status-dot.live{background:#2ECD71}.status-dot.done{background:#E74C3C}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:20px 14px;margin-top:12px}
.team-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.team-avatar{width:86px;height:86px;border:2px solid var(--g1);border-radius:50%;background:#E8F2EC;color:var(--g1);display:grid;place-items:center;font-size:24px;font-weight:700}
.team-name{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.class-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.class-head h2{flex:1;margin:0}
.panel-plus-row{display:flex;justify-content:center;margin:0 0 12px}
.panel-plus{width:70px;height:26px;background:#164734;color:#fff;font-size:22px;line-height:1;border:0;border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;padding:0}
.panel-plus:hover{background:#30634B}
.jg-add-row{display:flex;justify-content:center;margin:-12px -12px 0}
.jg-add-row .panel-plus{margin:0}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.split{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(330px,1fr);gap:16px;align-items:start}
.jg{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-width:0}
.jg>header{background:var(--g1);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.jg>header select{height:32px;font-size:13px;color:var(--t1);min-width:0;flex:1}
.jg .in{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.sqb{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--g1);background:#fff}
.sqb:hover{background:var(--sel)}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 0;text-align:center}
.match{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;min-width:280px}
.match .mt{font-size:14px;font-weight:600;padding:6px;border-radius:8px;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.match .mt.l{text-align:left}.match .mt.r{text-align:right}
.match .mt:not(:disabled):hover,.match .score:not(:disabled):hover{background:var(--sel)}
.match .mt:disabled,.match .score:disabled{opacity:1;cursor:default}
.match .ph{color:#B9C5BE}
.match .score{padding:4px;border-radius:8px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--t2);font-weight:700}
.sbox{min-width:38px;height:34px;padding:0 6px;border:1px solid #C9D3CD;border-radius:8px;background:#fff;color:var(--t1);display:grid;place-items:center;font-size:16px;font-weight:700}
.match .mfoot{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:space-between}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--g1);color:#fff;font-weight:600;padding:10px 10px;white-space:nowrap;text-align:center}
td{padding:9px 10px;text-align:center;white-space:nowrap;border-top:1px solid var(--line)}
tbody tr:nth-child(odd) td{background:#fff}
tbody tr:nth-child(even) td{background:var(--bg)}
tbody tr:hover td{background:var(--sel)}
th.l,td.l{text-align:left}
td.tot,td.tot button{font-weight:700}
td.tot{background:#E3F5EA !important}
.rk th:nth-child(1),.rk td:nth-child(1){position:sticky;left:0;width:56px;min-width:56px;z-index:1}
.rk th:nth-child(2),.rk td:nth-child(2){position:sticky;left:56px;z-index:1;box-shadow:2px 0 0 var(--line)}
.cellb{padding:2px 8px;border-radius:6px;text-decoration:underline dotted;text-underline-offset:3px}
.cellb:hover{background:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--t2);gap:3px}
.seg{display:inline-flex;border:1px solid var(--g1);border-radius:999px;overflow:hidden}
.seg button{padding:8px 16px;font-size:13px;font-weight:600;color:var(--g1)}
.seg button.on{background:var(--g1);color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0}
.field{display:block;margin:12px 0}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#0b1f17a6;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:24px;box-shadow:0 20px 60px #0006;width:100%;max-width:460px;padding:24px;max-height:calc(100vh - 32px);overflow:auto}
.modal.gray{background:var(--bg)}
.modal.wide{max-width:620px}
.modal.res .note{width:0;min-width:100%}
.modal.res{width:auto;min-width:min(430px,100%);max-width:min(780px,100%)}
.modal.menu{background:var(--g1);max-width:280px;padding:12px;border-radius:20px}
.modal.menu button{display:flex;gap:12px;align-items:center;width:100%;color:#fff;font-weight:600;padding:12px;border-radius:12px;text-align:left}
.modal.menu button:hover{background:var(--g2)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.mh h3{margin:0;font-size:20px}
.mico{width:40px;height:40px;border-radius:12px;background:var(--g1);color:#fff;display:grid;place-items:center}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.radio{display:flex;gap:10px;align-items:center;padding:7px 0}
.radio input{accent-color:var(--g1);width:18px;height:18px}
.slist{list-style:none;margin:8px 0;padding:0}
.slist li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.slist li.drag{background:var(--sel);box-shadow:0 4px 12px #0002}
.slist li>span{flex:1;min-width:0}
.grip{color:var(--g2);touch-action:none;cursor:grab;padding:4px;display:flex}
.opt{display:flex;gap:10px;align-items:center;width:100%;padding:11px 4px;color:var(--g1);font-weight:600;text-align:left;border-top:1px solid var(--line)}
.opt:disabled{color:#B5BFB9;opacity:1}
.score-list{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.score-game{min-width:0}
.score-game-title{display:block;text-align:center;margin:0 0 4px;color:var(--t2);font-size:12px;font-weight:600}
.score-pair{display:grid;grid-template-columns:minmax(0,auto) 60px 16px 60px minmax(0,auto);gap:8px;align-items:center;justify-content:center}
.score-team-label.a{justify-content:flex-end;text-align:right}
.score-team-label{min-height:42px;min-width:0;display:flex;align-items:center;font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.score-pair input{height:42px;width:100%;min-width:0;border:1px solid #C9D3CD;border-radius:10px;text-align:center;font-size:18px;padding:0 4px}
.score-times{text-align:center;font-weight:700;color:var(--t2)}
@media(max-width:520px){.score-pair{grid-template-columns:minmax(0,1fr) 48px 14px 48px minmax(0,1fr);gap:4px}.score-team-label{font-size:12px}.score-pair input{height:40px;font-size:16px}}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--t1);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px #0004}
.toast.err{background:var(--err)}
.vis{max-width:900px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--t2)}
.cfg{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pk{border:1px solid #C9D3CD;border-radius:999px;padding:8px 14px;background:#fff;font-size:14px}
.pk:hover{border-color:var(--g1)}
.pk.on{background:var(--g1);color:#fff;border-color:var(--g1);font-weight:600}
.neg{color:var(--err)}
td.q{box-shadow:inset 4px 0 0 var(--g3);font-weight:700}
td.qt{box-shadow:inset 4px 0 0 #E0A800;font-weight:700}
.tks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 4px}
.tk{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;background:#fff}
.tk small{display:block;font-size:11px;color:var(--t2);font-weight:600}.tk b{font-size:17px}
.tgr{margin:14px 0 6px;font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.tg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-left:5px solid #B9C5BE;border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff}
.tg.win{border-left-color:var(--g3)}.tg.loss{border-left-color:var(--err)}
.tg .tn{font-size:14px;overflow-wrap:anywhere;line-height:1.25}.tg .tn.r{text-align:right}.tg .tn.me{font-weight:700;color:var(--g1)}
.tg .tsc{display:flex;gap:6px;align-items:center;color:var(--t2);font-weight:700}
.tg .tf{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tg.win .tres{color:#12683A}.tg.loss .tres{color:var(--err)}.tg.pend .tres{color:var(--t2)}
.scrim{display:none}
@media(max-width:1180px){.split{grid-template-columns:1fr}}
@media(max-width:900px){
 .top .burger{display:flex}
 .side{position:fixed;top:0;bottom:0;left:0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
 .nav .side{transform:none}
 .nav .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:39}
 .main{padding:14px 12px}
 .split{grid-template-columns:1fr}
}
@media(max-width:560px){
 .addrow{flex-direction:column;align-items:stretch}
 .addrow .pill{height:44px}
 .kpi{flex:1}
 .team-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 8px}
 .pill{min-height:40px}
 .rk th:nth-child(2),.rk td:nth-child(2){position:static;box-shadow:none}
 td,th{padding:8px 7px}
}

/* ===== responsividade e toque (um só código para celular, tablet e computador) ===== */
.split>*{min-width:0}
.top>span:first-of-type{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top #sync{white-space:nowrap;flex:none}
.panel{height:calc(100dvh - 56px)}
.modal{max-height:calc(100dvh - 32px)}
.modal>.acts,.modal>form>.acts{position:sticky;bottom:-24px;margin-bottom:-24px;padding:10px 0 24px;background:#fff;z-index:2}
.modal.gray>.acts,.modal.gray>form>.acts{background:var(--bg)}
.panel-plus{position:relative}
.panel-plus::after{content:"";position:absolute;inset:-10px -8px}
@media(max-width:900px){.panel{min-height:0}}
@media(max-width:520px){
 .ov{padding:8px}
 .toasts{bottom:auto;top:64px}
 .modal{padding:16px;border-radius:18px;max-height:calc(100dvh - 16px)}
 .modal>.acts,.modal>form>.acts{bottom:-16px;margin-bottom:-16px;padding-bottom:16px}
 .modal.res{min-width:0;width:100%}
 .tks{grid-template-columns:repeat(3,1fr)}
 .crumb{margin-bottom:12px}
 h1{font-size:20px}
}
@media(max-width:400px){
 .match{min-width:0;padding:8px 6px;gap:4px}
 .match .mt{font-size:13px;padding:4px}
 .sbox{min-width:32px;height:32px;font-size:15px}
 .top{padding:0 12px;gap:8px;font-size:14px}
 .top #sync{display:none}
 .main{padding:12px 8px}
 .jg .in{padding:8px}
}
@media(pointer:coarse),(max-width:900px){
 .crumb a,.side .foot button{display:inline-flex;align-items:center;min-height:36px}
 .name,.ibtn,.cellb{min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center}
 .name{justify-content:flex-start}
 td .name{text-align:left}
 .grip{padding:10px}
 .match .mt{min-height:36px}
 .rows input[type=checkbox],.chk input,.radio input,.slist input[type=checkbox]{width:22px!important;height:22px!important}
 .sqb{width:40px;height:40px}
 .pill.sm,.sm{min-height:36px}
 .chip button{padding:6px}
 input[type=range]{height:32px}
}
@media(pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}

/* ===== classificação em cards, menu arredondado, sem barra superior ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cls-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.cls-ctl select{min-width:0;max-width:100%;font-weight:600}
.cls-ctl .seg button:disabled{color:#9AA7A0;opacity:1}
.gcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:14px}
.gcard .gt{margin:0 0 10px;text-align:center;font-size:16px;font-weight:700}
.gcard .tw{border-radius:10px}
table.cls td{height:44px;padding:6px 10px;border-top:1px solid #E6EBE8}
table.cls tbody tr:nth-child(odd) td{background:#fff}
table.cls tbody tr:nth-child(even) td{background:#F3F5F4}
table.cls tbody tr:nth-child(odd) td.tot{background:#fff!important}
table.cls tbody tr:nth-child(even) td.tot{background:#F3F5F4!important}
table.cls tbody tr:hover td,table.cls tbody tr:hover td.tot{background:var(--sel)!important}
table.cls tbody tr:hover td{background:var(--sel)}
table.cls td.q,table.cls td.qt{box-shadow:none;font-weight:400}

 return secs.map(s=>{let pos=1;const rows=[];
  rankGroups(ph,st,s.ids).forEach(g=>{g.map(id=>({pos,tie:g.length>1&&st[id].j>0,id,name:dl(T(id)),s:st[id]})).sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>rows.push(r));pos+=g.length});
  return{title:s.title,groupId:s.groupId,ids:s.ids,rows}})}

/* ----- ranking geral (sempre calculado a partir das partidas: nunca duplica) ----- */
function computeRanking(st){
 const tours=db.champs.filter(c=>(st.season==='all'||String(c.season)===String(st.season))&&(st.champ!=='all'?c.id===st.champ:!c.isFinal)).sort((a,b)=>when(a)-when(b));
 const rows=new Map(),row=id=>{if(!rows.has(id))rows.set(id,{id,j:0,v:0,d:0,pg:0,pc:0,dp:0,per:{},total:0,tr:0});return rows.get(id)};
 const cell=(r,cid)=>r.per[cid]||(r.per[cid]={pts:0,j:0,v:0,d:0,pg:0,pc:0});
 const ents=t=>st.mode==='d'?[t.id]:t.players;
 for(const c of tours)for(const ph of c.phases){
  ph.teamIds.forEach(tid=>{const t=T(tid);t&&ents(t).forEach(id=>cell(row(id),c.id))});
  for(const m of phMatches(ph))for(const g of resultGames(ph,m)){
   [[m.a,g.a,g.b],[m.b,g.b,g.a]].forEach(([tid,forPts,against])=>{const t=T(tid);if(!t)return;ents(t).forEach(id=>{const R=row(id),k=cell(R,c.id),win=g.winner===tid;
    R.j++;k.j++;R.pg+=forPts;R.pc+=against;R.dp=R.pg-R.pc;k.pg+=forPts;k.pc+=against;
    if(win){R.v++;k.v++;const w=db.settings.ppw;k.pts+=w;R.total+=w}else{R.d++;k.d++}})})}}
 for(const c of tours)champPodium(c).forEach((tid,i)=>{const t=tid&&T(tid);if(!t)return;ents(t).forEach(id=>{const R=row(id),k=cell(R,c.id);k.bonus=BONUS[i];k.place=i+1;R.total+=BONUS[i];R.bonus=(R.bonus||0)+BONUS[i]})});
 let list;
 if(st.mode==='d'){list=db.teams.filter(t=>t.players.length===2||rows.has(t.id)).map(t=>{const r=row(t.id);r.name=dl(t);r.active=t.active&&t.players.length===2;
   if(st.champ==='all'){r.tr=(t.transfers||[]).filter(x=>st.season==='all'||String(x.season)===String(st.season)).reduce((a,x)=>a+x.points,0);r.total+=r.tr}return r})}
 else list=db.players.map(p=>{const r=row(p.id);r.name=p.name;r.active=true;return r});
 const srt=(a,b)=>b.total-a.total||b.v-a.v||b.pg-a.pg||a.j-b.j||a.name.localeCompare(b.name);
 const act=list.filter(r=>r.active).sort(srt),ina=list.filter(r=>!r.active).sort(srt);
 act.forEach((r,i)=>r.pos=i+1);ina.forEach(r=>r.pos=null);
 if(st.mode==='d'&&st.champ==='all'&&st.season!=='all'){const E=act.filter(r=>Object.keys(r.per).length>=db.settings.minT&&(r.j>0||r.tr>0)),n=db.settings.slots,key=r=>[r.total,r.v,r.pg,r.j].join('|');
  if(E.length<=n)E.forEach(r=>r.q=true);else{const k=key(E[n-1]);if(k===key(E[n]))E.forEach((r,i)=>{if(key(r)===k)r.qt=true;else if(i<n)r.q=true});else E.slice(0,n).forEach(r=>r.q=true)}}
 return{tours,list:st.inactive?[...act,...ina]:act}}
const RKH=[['P','Partidas'],['V','Vitórias'],['D','Derrotas'],['PP','Pontos pró (pontos ganhos)'],['PC','Pontos contra (pontos sofridos)'],['DP','Diferença de pontos (saldo)']];
function rankHTML(st){const{tours,list}=computeRanking(st),q=norm(st.q),rows=list.filter(r=>!q||norm(r.name).includes(q));
 const d=`data-mode="${st.mode}" data-season="${st.season}"`;
 if(!rows.length)return`<p class="empty">${st.mode==='d'?'Nenhuma dupla encontrada. Forme duplas com dois jogadores em Cadastro de equipes.':'Nenhum jogador encontrado.'}</p>`;
 return`<div class="tw"><table class="rk"><thead><tr><th>Pos.</th><th class="l">${st.mode==='d'?'Dupla':'Jogador'}</th>${RKH.map(([a,t])=>`<th title="${t}"><abbr title="${t}">${a}</abbr></th>`).join('')}${tours.map(c=>`<th class="rkt" title="Pontos no torneio ${esc(c.name)}"><span>${esc(c.name)}</span></th>`).join('')}<th title="Total de pontos"><abbr title="Total de pontos">TP</abbr></th></tr></thead><tbody>${
 rows.map(r=>`<tr class="${r.q?'q':r.qt?'qt':''}"><td><span class="posb blue" title="${r.q?'Classificada para o torneio final':r.qt?'Empate na última vaga: depende do desempate':''}">${r.pos?r.pos+'º':'—'}</span></td><td class="l"><button class="name" data-a="rkTot" data-id="${r.id}" data-champ="${st.champ}" ${d} title="Ver o histórico de torneios">${esc(r.name)}</button> ${r.active?'':'<span class="tag off">Inativa</span>'}</td><td>${r.j}</td><td>${r.v}</td><td>${r.d}</td><td>${r.pg}</td><td>${r.pc}</td><td>${r.dp}</td>${
  tours.map(c=>`<td>${r.per[c.id]?`<button class="cellb" data-a="rkCell" data-id="${r.id}" data-cid="${c.id}" ${d}>${r.per[c.id].pts+(r.per[c.id].bonus||0)}</button>`:'—'}</td>`).join('')
 }<td class="tot"><button class="cellb" data-a="rkTot" data-id="${r.id}" data-champ="${st.champ}" ${d}>${fmt(r.total)}</button></td></tr>`).join('')}</tbody></table></div><p class="rkleg">${RKH.map(([a,t])=>`<b>${a}</b> ${t}`).join(' · ')} · <b>TP</b> Total de pontos</p>`}

function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3800)}
const stack=[];
function modal(html,opt={}){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="modal ${opt.cls||''}" role="dialog" aria-modal="true">${html}</div>`;
 document.body.appendChild(ov);const o={ov,opt,dirty:false,prev:document.activeElement};stack.push(o);
 ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
 const dirt=e=>{if(!e.target.closest('[data-nodirty]'))o.dirty=true};ov.addEventListener('input',dirt);ov.addEventListener('change',dirt);
 const f=ov.querySelector('[autofocus]')||ov.querySelector('input:not([type=hidden]),select,button');f&&f.focus();return ov.firstElementChild}
async function closeModal(force){const o=stack[stack.length-1];if(!o)return;
 if(!force&&o.dirty&&o.opt.guard&&!await confirmBox({title:'Descartar alterações?',msg:'Existem alterações não salvas nesta janela.',ok:'Descartar',danger:true}))return;
 stack.splice(stack.indexOf(o),1);o.ov.remove();o.opt.done&&o.opt.done(null);try{o.prev&&o.prev.focus()}catch(e){}}
const mHead=(t,sub)=>`<div class="mh"><div><h3>${t}</h3>${sub?`<p class="muted" style="margin:4px 0 0">${sub}</p>`:''}</div><button type="button" class="ibtn" data-a="closeM" aria-label="Fechar">${I.x}</button></div>`;
function confirmBox({title,msg,ok='Confirmar',cancel='Cancelar',danger,alertOnly}){return new Promise(res=>{let done=false;
 const el=modal(`<div class="mh"><div style="display:flex;gap:12px;align-items:center">${alertOnly||danger?`<span style="color:${danger?'var(--err)':'#C77700'}">${I.alert}</span>`:''}<h3>${esc(title)}</h3></div></div><p>${msg}</p>
 <div class="acts">${alertOnly?'':`<button class="pill ghost" data-v="0">${cancel}</button>`}<button class="pill ${danger?'red':''}" data-v="1" autofocus>${alertOnly?'Fechar':ok}</button></div>`,{done:()=>{if(!done)res(false)}});
 el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;done=true;res(b.dataset.v==='1');closeModal(true)})})}
const alertBox=(title,msg)=>confirmBox({title,msg,alertOnly:true});
function sortable(ul){
 ul.addEventListener('pointerdown',e=>{const hd=e.target.closest('.grip');if(!hd)return;const li=hd.closest('li');e.preventDefault();li.classList.add('drag');
  const mv=ev=>{let before=null;for(const s of[...ul.children].filter(x=>x!==li)){const r=s.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=s;break}}ul.insertBefore(li,before)};
  const up=()=>{li.classList.remove('drag');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);ul.dispatchEvent(new Event('change',{bubbles:true}))};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up,{once:true})});
 ul.addEventListener('keydown',e=>{const hd=e.target.closest('.grip');if(!hd)return;const li=hd.closest('li');
  if(e.key==='ArrowUp'&&li.previousElementSibling)ul.insertBefore(li,li.previousElementSibling);
  else if(e.key==='ArrowDown'&&li.nextElementSibling)ul.insertBefore(li.nextElementSibling,li);else return;
  e.preventDefault();hd.focus();ul.dispatchEvent(new Event('change',{bubbles:true}))})}

function champTiers(c){if(statusKey(c)!=='done'||!c.result)return null;const tiers=[],placed=new Set(),put=g=>{g=g.filter(id=>id&&!placed.has(id));if(g.length){tiers.push(g);g.forEach(id=>placed.add(id))}};
 [c.result.champion,c.result.vice,c.result.third,c.result.fourth].forEach(id=>put([id]));
 for(let i=c.phases.length-1;i>=0;i--){const ph=c.phases[i];
  if(ph.type==='elim'){const f=finalOf(ph),t=thirdOf(ph);if(f&&winner(f)){put([winner(f)]);put([winner(f)===f.a?f.b:f.a])}if(t&&winner(t)){put([winner(t)]);put([winner(t)===t.a?t.b:t.a])}
   for(let k=ph.rounds.length-1;k>=0;k--)put(ph.rounds[k].matches.filter(m=>!m.third&&winner(m)).map(m=>winner(m)===m.a?m.b:m.a));put([...ph.teamIds])}
  else rankGroups(ph,phaseStats(ph),ph.teamIds.filter(id=>!placed.has(id))).forEach(g=>put([...g]))}
 return tiers}

function champPlace(c,teamId){const t=champTiers(c);if(!t||!teamId)return null;let pos=1;for(const g of t){if(g.includes(teamId))return pos;pos+=g.length}return null}
function entMatches(id,mode,c){const out=[];c.phases.forEach(ph=>ph.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.a||!m.b)return;const side=[m.a,m.b].find(tid=>mode==='d'?tid===id:T(tid)?.players.includes(id));if(!side)return;resultGames(ph,m).forEach((g,index)=>out.push({ph,r,m,side,win:g.winner===side,g,index,pts:g.winner===side?db.settings.ppw:0}))})));return out}
